gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/html text/plain text/css application/javascript text/javascript application/json image/svg+xml;

server {
    listen 8000;
    server_name balabusta.homes www.balabusta.homes;

    root /usr/share/nginx/html/root;
    index index.html;
    absolute_redirect off;

    # /meet-rena/ -> 301 /meet-rena (query string kept). Only plain path
    # segments are captured so Location can never start with "//" or "/\"
    # (open redirect); anything else falls through to 404.
    rewrite "^/((?:[A-Za-z0-9_-][A-Za-z0-9._-]*/)*[A-Za-z0-9_-][A-Za-z0-9._-]*)/$" /$1 permanent;

    # try_files below no longer has $uri/, which is what served "/" before
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # /meet-rena -> meet-rena.html (the site is a static snapshot of an SSR app)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html =404;
    }

    # content-hashed build output
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /images/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    error_page 404 /404.html;
}

server {
    listen 8000 default_server;
    server_name _;

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location / {
        return 404;
    }
}
